name: lms
services:
  mariadb:
    image: mariadb:10.8
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # Port HTTP của Qdrant
      - "6334:6334" # Port gRPC của Qdrant
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant-data:/qdrant/storage

  9router:
    image: decolua/9router:latest
    ports:
      - "20128:20128"
    environment:
      INITIAL_PASSWORD: "123456"

  openkb:
    build:
      context: ./openkb
    image: lms-openkb:ff54396
    env_file:
      - ./.env.openkb
    environment:
      OPENKB_KB_ROOT: /data/kbs
      NO_PROXY: localhost,127.0.0.1,9router,openkb
    ports:
      - "127.0.0.1:7566:7566"
    volumes:
      - openkb-data:/data
      - openkb-config:/root/.config/openkb
      - ./openkb:/app:ro
    depends_on:
      - 9router
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:7566/api/v1/meta',headers={'Authorization':'Bearer '+os.environ['OPENKB_API_TOKEN']}); urllib.request.urlopen(r,timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  frappe-chat-worker:
    image: frappe/bench:latest
    command: bench worker --queue short
    working_dir: /workspace/frappe-bench
    env_file:
      - ./.env.openkb-frappe
    environment:
      NO_PROXY: localhost,127.0.0.1,mariadb,redis,openkb
    volumes:
      - .:/workspace
    depends_on:
      frappe:
        condition: service_started
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    env_file:
      - ./.env.openkb-frappe
    depends_on:
      openkb:
        condition: service_healthy
    environment:
      - SHELL=/bin/bash
      #- HTTP_PROXY=http://10.53.120.1:8080
      #- HTTPS_PROXY=http://10.53.120.1:8080
      #- http_proxy=http://10.53.120.1:8080
      #- https_proxy=http://10.53.120.1:8080
      - NO_PROXY=localhost,127.0.0.1,mariadb,redis,qdrant,9router,openkb
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
      - "9000:9000"

volumes:
  mariadb-data:
  qdrant-data:
  openkb-data:
  openkb-config:
