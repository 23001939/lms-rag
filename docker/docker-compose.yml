version: "3.7"
name: lms
services:
  mariadb:
    image: mariadb:10.8
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # Port HTTP của Qdrant
      - "6334:6334" # Port gRPC của Qdrant
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant-data:/qdrant/storage

  9router:
    image: decolua/9router:latest
    ports:
      - "20128:20128"
    environment:
      INITIAL_PASSWORD: "123456"
    

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      #- HTTP_PROXY=http://10.53.120.1:8080
      #- HTTPS_PROXY=http://10.53.120.1:8080
      #- http_proxy=http://10.53.120.1:8080
      #- https_proxy=http://10.53.120.1:8080
      # Đã sửa chromadb thành qdrant cho khớp với service name bên trên
      - NO_PROXY=localhost,127.0.0.1,mariadb,redis,qdrant,9router
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
      - "9000:9000"

volumes:
  mariadb-data:
  qdrant-data:
